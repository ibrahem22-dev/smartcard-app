name: CI

# ==============================================================================================
# WP-12.1 — CI BUILDS THE APP FOR THE FIRST TIME, ON THE OWNER'S RULING FOR OQ-003.
#
# WHAT WAS WRONG, AND FOR HOW LONG
#
# This workflow existed since WP-1.3 and had NEVER REACHED A GATE. Every run since it was created
# died at `npm ci`, because the app's sole data dependency is
#
#     "@smartcard/data-authority-adapter": "file:../smartcard-data-pipeline/dist/adapter-package"
#
# a relative path into a SECOND repository — which is private, and which CI never checked out. The
# old file's comments discussed at length which gates it tolerated going red. None of them ran. The
# failure was one line into the install, and the comments were written as though the ladder executed.
#
# That is the defect this campaign hunts by name: a check that cannot fail, wearing the costume of
# one that can. It was raised as F4 / OQ-003 rather than patched, because every route to fixing it
# needs a credential or a disclosure decision that belongs to the Owner and to nobody else.
#
# THE RULING (OQ-003, answered 2026-08-24)
#
#   "For P2, CI shall access the private smartcard-data-pipeline repository using an Owner-provided
#    deploy key or fine-grained PAT stored as a repository secret, check out the pipeline as a
#    sibling, and build the adapter from authoritative source. Do not make the pipeline public and
#    do not vendor adapter output into the public app repo. Registry publication remains the
#    preferred later architecture."
#
# So: two checkouts, siblings, the adapter COMPILED here from pipeline source rather than copied in.
#
# AND WHAT THIS RUN IS NOW EVIDENCE FOR (OQ-004, answered the same day)
#
#   "For P2 closure, FRESH means a different machine/environment from the development working
#    machine. GitHub CI is accepted as that machine when it checks out from scratch, clean-installs
#    dependencies, builds the authoritative adapter, and runs the required P2 verification.
#    E6, E7 and F4 must be proven there."
#
# Three criteria are decided by this file, and the verdict step at the bottom asserts each by its
# own contracted sentinel, read from printed output:
#
#   F4  CI exists in the app repo and runs the whole ladder     ->  P2-ALL OK — every step green
#   E7  the ladder reproduces in a fresh clone of the pushed    ->  P2-ALL OK — every step green
#       sha, on a machine that has never built this app             (this runner, provably)
#   E6  every criterion validated against the real shipped      ->  REAL-ARTIFACTS OK — 5 of 5
#       artifacts at their measured shas                            shas matched
#
# A NOTE ON FORK PULL REQUESTS, WHICH IS A REAL FINDING AND NOT A CAVEAT
#
# GitHub does not expose secrets to workflows triggered by a fork's pull request. This build will
# therefore FAIL on any outside contribution — loudly, at the guard step, saying why. That is not a
# workflow bug to be papered over with `continue-on-error`: it is the true state of the product.
# **The app repository is public and cannot be built by anyone outside the Owner's account**, because
# its only data dependency is private. Recorded in `campaign-p2/closure/P2_DEFERRED.md` §2.15;
# registry publication (OQ-003 option 2) is the fix and is deferred, not forgotten.
# ==============================================================================================

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIPELINE_REPO: ibrahem22-dev/smartcard-data-pipeline

jobs:
  verify:
    runs-on: ubuntu-latest

    # ----------------------------------------------------------------------------------------------
    # `secrets` IS NOT A CONTEXT A STEP'S `if:` CAN SEE, AND THIS WORKFLOW LEARNED THAT THE HARD WAY.
    #
    # The first version wrote `if: ${{ secrets.PIPELINE_DEPLOY_KEY != '' }}` on the two checkout
    # steps. GitHub rejected the FILE — not the run, the file — before any job started:
    #
    #     (Line: 139, Col: 13): Unrecognized named-value: 'secrets'.
    #
    # `secrets` is available in `env:`, in `with:` and in a job-level `if:`, but **not** in a step's
    # `if:`. The fix is the documented pattern: derive NON-SECRET boolean presence flags here, where
    # `secrets` is legal, and let the steps below branch on those.
    #
    # WHAT CROSSES FROM SECRET TO NON-SECRET, AND WHAT DOES NOT.
    # `secrets.X != ''` evaluates to the string `true` or `false`. That is a fact ABOUT the secret —
    # whether one was configured — and carries none of its bytes. The key itself is still passed
    # exactly once, into `actions/checkout`'s `ssh-key:`, which is the only place it is needed and
    # the only place it appears. Nothing echoes it, nothing writes it to a file, and GitHub masks it
    # in logs regardless.
    #
    # HOW THIS GOT SHIPPED, WHICH IS THE MORE USEFUL LESSON.
    # The workflow was validated locally by PARSING IT AS YAML, and it is perfectly valid YAML. What
    # it is not is a valid *workflow*: expression contexts are a GitHub rule that no YAML parser
    # knows about. A check that cannot detect the failure it exists to prevent is this campaign's
    # oldest defect, committed here by the check written to prevent it. `tools/p2/ci-workflow-controls.mjs`
    # now refuses `secrets.` inside any `if:`, and was watched to fail against the broken file.
    # ----------------------------------------------------------------------------------------------
    env:
      HAVE_PIPELINE_DEPLOY_KEY: ${{ secrets.PIPELINE_DEPLOY_KEY != '' }}
      HAVE_PIPELINE_PAT: ${{ secrets.PIPELINE_PAT != '' }}

    steps:
      # ------------------------------------------------------------------------------------------
      # THE GUARD RUNS FIRST, AND FAILS. IT DOES NOT SKIP.
      #
      # A missing credential must not produce a green build. If this job were allowed to skip the
      # pipeline checkout and "pass" the steps that remain, it would print success while proving
      # nothing — and F4's evidence is a CI run printing a sentinel, so a green build that never
      # reached the ladder is precisely a false close.
      #
      # It runs BEFORE the checkouts so the failure message names the cause. `actions/checkout`
      # against a private repository with no credential fails with a bare 128 and a "repository not
      # found" — which reads like a typo in the repository name, and cost this campaign a wrong
      # diagnosis once already.
      # ------------------------------------------------------------------------------------------
      - name: the credential OQ-003 requires is present
        working-directory: ${{ github.workspace }}
        run: |
          echo "deploy key present: $HAVE_PIPELINE_DEPLOY_KEY"
          echo "PAT present:        $HAVE_PIPELINE_PAT"
          if [ "$HAVE_PIPELINE_DEPLOY_KEY" != "true" ] && [ "$HAVE_PIPELINE_PAT" != "true" ]; then
            echo "::error::No credential for the private pipeline repository."
            echo ""
            echo "This build cannot install the app. The app depends on"
            echo "  @smartcard/data-authority-adapter -> file:../smartcard-data-pipeline/dist/adapter-package"
            echo "which lives in $PIPELINE_REPO, a PRIVATE repository."
            echo ""
            echo "The Owner ruled OQ-003: add ONE of these repository secrets to smartcard-app —"
            echo "  PIPELINE_DEPLOY_KEY   an SSH private key whose public half is a read-only"
            echo "                        deploy key on $PIPELINE_REPO   (preferred)"
            echo "  PIPELINE_PAT          a fine-grained PAT with Contents:read on that repository"
            echo ""
            echo "Setup commands: campaign-p2/OWNER_SETUP_CI.md in the pipeline repository."
            echo ""
            echo "If this is a pull request from a FORK, secrets are withheld by design and this"
            echo "build cannot pass. That is a true statement about the product, not a CI defect:"
            echo "a public app with a private data dependency is not buildable by outsiders."
            exit 1
          fi
          echo "A credential is available. The pipeline will be checked out as a sibling."

      # ------------------------------------------------------------------------------------------
      # TWO CHECKOUTS, LAID OUT AS SIBLINGS, BECAUSE THE DEPENDENCY IS A RELATIVE PATH.
      #
      #   $GITHUB_WORKSPACE/smartcard-app/               <- this repository
      #   $GITHUB_WORKSPACE/smartcard-data-pipeline/     <- the authority
      #
      # `file:../smartcard-data-pipeline/...` resolves from the app root, so the names of these two
      # directories are load-bearing and must not be tidied.
      # ------------------------------------------------------------------------------------------

      # FULL HISTORY, NOT A SHALLOW CLONE. `actions/checkout` defaults to depth 1, and the app-root
      # gate (F1, OD-13) asks whether the repository's history was PRESERVED through the relocation:
      # how many commits it has, and whether the first predates the move. A depth-1 clone answers
      # "one commit, dated today" to both — which is what a re-initialised repository looks like.
      - name: app
        uses: actions/checkout@v4
        with:
          path: smartcard-app
          fetch-depth: 0

      # Two steps rather than one, because `actions/checkout` takes `ssh-key` OR `token` and an
      # expression cannot choose between two differently-named inputs. The deploy key wins when both
      # are set: it is scoped to one repository and read-only, where a PAT is an account credential.
      - name: pipeline (deploy key)
        if: ${{ env.HAVE_PIPELINE_DEPLOY_KEY == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ibrahem22-dev/smartcard-data-pipeline
          ref: ${{ vars.PIPELINE_REF || 'main' }}
          ssh-key: ${{ secrets.PIPELINE_DEPLOY_KEY }}
          path: smartcard-data-pipeline
          fetch-depth: 0

      - name: pipeline (fine-grained PAT)
        if: ${{ env.HAVE_PIPELINE_DEPLOY_KEY != 'true' && env.HAVE_PIPELINE_PAT == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ibrahem22-dev/smartcard-data-pipeline
          ref: ${{ vars.PIPELINE_REF || 'main' }}
          token: ${{ secrets.PIPELINE_PAT }}
          path: smartcard-data-pipeline
          fetch-depth: 0

      # POSITIVE ASSERTION ON THE CHECKOUT, not "the step before did not fail". Both checkout steps
      # carry an `if:`, and a skipped step in GitHub Actions is a SUCCESS — so without this, a
      # condition that silently evaluated false would sail past and fail later at `npm ci` with a
      # module-resolution error four steps from its cause.
      - name: the pipeline is really there, and this is which sha
        working-directory: ${{ github.workspace }}
        run: |
          test -f smartcard-data-pipeline/package.json \
            || { echo "::error::the pipeline checkout did not happen"; exit 1; }
          test -d smartcard-data-pipeline/campaign-p2/bin \
            || { echo "::error::the pipeline is present but has no campaign-p2/bin"; exit 1; }
          echo "app      $(git -C smartcard-app rev-parse HEAD)"
          echo "pipeline $(git -C smartcard-data-pipeline rev-parse HEAD)"
          {
            echo "### The two shas this run measured"
            echo ""
            echo "| repository | sha |"
            echo "|---|---|"
            echo "| smartcard-app | \`$(git -C smartcard-app rev-parse HEAD)\` |"
            echo "| smartcard-data-pipeline | \`$(git -C smartcard-data-pipeline rev-parse HEAD)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------------------------------
      # A CI CHECKOUT IS A DETACHED HEAD, AND F5 ASKS A QUESTION A DETACHED HEAD CANNOT ANSWER.
      #
      # `gate:repos-in-sync` resolves `@{u}` and reports "the branch tracks no remote" when it
      # cannot — correct behaviour on a detached HEAD, and it would fail this build for a reason
      # that has nothing to do with the repositories being out of sync.
      #
      # This does not weaken the gate. It gives CI the local branch a real clone would have, at the
      # exact sha already checked out, so the ahead/behind comparison the criterion asks for is
      # actually possible. If the sha is not the branch head, the gate still says so and still fails.
      # ------------------------------------------------------------------------------------------
      - name: give both checkouts the tracking branch a real clone would have
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          app_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git -C smartcard-app checkout -B "$app_branch" "$(git -C smartcard-app rev-parse HEAD)"
          git -C smartcard-app branch --set-upstream-to "origin/$app_branch" "$app_branch"

          pipe_branch="${{ vars.PIPELINE_REF || 'main' }}"
          git -C smartcard-data-pipeline checkout -B "$pipe_branch" \
            "$(git -C smartcard-data-pipeline rev-parse HEAD)"
          git -C smartcard-data-pipeline branch --set-upstream-to "origin/$pipe_branch" "$pipe_branch"

          echo "app      $app_branch  -> $(git -C smartcard-app rev-parse --abbrev-ref '@{u}')"
          echo "pipeline $pipe_branch -> $(git -C smartcard-data-pipeline rev-parse --abbrev-ref '@{u}')"

      - uses: actions/setup-node@v4
        with:
          # Pinned to the runtime .nvmrc names. The pipeline repository spent a campaign running its
          # gate ladder on a machine-wide Node 24 while every file said 20, so the version is stated
          # here and asserted below rather than assumed from the runner image.
          node-version-file: smartcard-app/.nvmrc

      # ------------------------------------------------------------------------------------------
      # THE SETUP ORDER, WHICH UNTIL NOW EXISTED NOWHERE.
      #
      # The closure fresh clone found this by running into it: the app cannot be installed from a
      # clean checkout without first compiling the pipeline, and no file in either repository said
      # so. A reader who does the obvious thing — clone the app, npm ci — gets TS2307 with no
      # indication that a second repository is involved. So did CI, on every run, for the whole
      # campaign.
      #
      # It is written here because here it is EXECUTED. A README saying the same thing would be a
      # claim; these five steps are the claim being tested on every push.
      #
      #   1. pipeline  npm ci          the lockfile, never a resolver
      #   2. pipeline  npx tsc         build:adapter REFUSES on a stale dist/, which is how the
      #   3. pipeline  build:adapter   ordering became visible at all
      #   4. pipeline  build:packs     p2-org-kinds --check reads the BUILT taxonomy pack; without
      #                                this the mirror-parity gate cannot compare it
      #   5. app       npm ci          only now does the file: dependency resolve
      # ------------------------------------------------------------------------------------------
      - name: pipeline — install
        working-directory: smartcard-data-pipeline
        run: npm ci

      - name: pipeline — compile
        working-directory: smartcard-data-pipeline
        run: npx tsc

      - name: pipeline — build the adapter from authoritative source
        working-directory: smartcard-data-pipeline
        run: |
          set -o pipefail
          npm run build:adapter 2>&1 | tee adapter.log
          grep -qF 'BUILD-ADAPTER OK' adapter.log \
            || { echo "::error::BUILD-ADAPTER OK was not printed"; exit 1; }

      # ------------------------------------------------------------------------------------------
      # `build:packs` IS NOT RUN HERE, AND IT NEVER CAN BE.
      #
      # This step used to run it, and run #58 died on it. `scripts/build-packs.mjs` reads the
      # canonical estate:
      #
      #     C:\Users\ebrah\All application data\smartcard-canonical-v1     (932 MB, Owner machine)
      #
      # That is not in any repository, is read-only by ACL, and cannot exist on a runner. Signing
      # additionally needs the Owner-controlled key OB-8 says lives on no machine this campaign runs
      # on. **This is a fact about where the data lives, not a gap to be filled.**
      #
      # NOTHING IS SKIPPED AS A RESULT. Exactly one thing needed `dist/packs`: the `p2-org-kinds`
      # mirror check, which reads the taxonomy pack. It now prefers `dist/packs` and falls back to
      # **the app's committed copy of the same artifact** — whose sha criterion **E6** verifies
      # against the contract in this very job. The comparison still happens, against the bytes that
      # ship; only the path differs, and the check prints which one it used.
      #
      # The assertion below is what stops that being a hole: if the committed pack were missing, the
      # fallback would have nothing to read, and this fails here with a clear cause rather than
      # thirty steps later inside a mirror check.
      # ------------------------------------------------------------------------------------------
      - name: the packs cannot be built here, so the shipped copy must be present
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          for p in taxonomy catalog benefits content; do
            f="smartcard-app/src/data/adapter/packs/$p/pack.json"
            test -f "$f" || { echo "::error::$f is missing — the ladder reads the shipped packs"; exit 1; }
            echo "  ok  $f  $(wc -c < "$f") bytes"
          done
          echo "build:packs deliberately not run: it reads the canonical estate, which no runner has."

      # `npm ci`, never `npm install`. npm install is permitted to RESOLVE a dependency to a version
      # the lockfile does not name — it updates the lockfile rather than failing — so CI would be
      # verifying a tree that need not be the one a reviewer gets from a clean clone.
      - name: app — install (this is the step that failed every previous run)
        working-directory: smartcard-app
        run: npm ci

      - name: the runtime is the pinned one
        working-directory: smartcard-app
        run: |
          echo "node $(node --version)  ·  .nvmrc $(cat .nvmrc)"
          test "v$(cat .nvmrc | tr -d '[:space:]')" = "$(node --version)"

      - name: the adapter resolved to the one just built, not a cached copy
        working-directory: smartcard-app
        run: |
          set -e
          node -e "console.log(require.resolve('@smartcard/data-authority-adapter/package.json'))"
          test -f node_modules/@smartcard/data-authority-adapter/package.json
          echo "adapter version $(node -p "require('@smartcard/data-authority-adapter/package.json').version")"

      - name: typecheck
        working-directory: smartcard-app
        run: npx tsc --noEmit

      - name: lint
        working-directory: smartcard-app
        run: npm run lint

      - name: tests
        working-directory: smartcard-app
        run: npx jest --ci

      # ------------------------------------------------------------------------------------------
      # THE 23-SCENARIO BATTERY AS ITS OWN STEP — P3 criterion S4. Not folded into the jest blob:
      # the battery is the campaign's acceptance asset and its sentinel must be readable on its
      # own in the CI log. Same discipline as the ladder below: the exact contracted sentinel
      # must be PRESENT in the captured output; absence is failure.
      # ------------------------------------------------------------------------------------------
      - name: the 23-scenario battery through the real engines (S4)
        working-directory: smartcard-app
        run: |
          set -o pipefail
          npm run p3:scenarios 2>&1 | tee "$RUNNER_TEMP/p3-scenarios.log"
          grep -q "SCENARIOS OK — 23 of 23" "$RUNNER_TEMP/p3-scenarios.log"

      # ------------------------------------------------------------------------------------------
      # THE LADDER. THIS STEP DECIDES F4, E7 AND E6.
      #
      # THE VERDICT IS READ FROM PRINTED OUTPUT, never from an exit code: exit codes are advisory in
      # this project and have been observed false.
      #
      # Each assertion is POSITIVE — the exact contracted sentinel must be PRESENT. Not "no failure
      # text appeared": an absent sentinel is a failure, which is what catches a ladder that died
      # before reaching the gate at all. That distinction is the whole reason the old version of
      # this file was able to look reasonable while never running.
      #
      # There is no tolerance clause any more. The previous version excused `P2-ALL DEVICE-BLOCKED`
      # because CI has no phone. The DEVICE criteria (B2, C2, E1, F2) are not ladder steps — they
      # are captured device evidence the ledger verifies — so the ladder either goes green here or
      # something is genuinely wrong.
      # ------------------------------------------------------------------------------------------
      - name: the whole ladder (F4, E7) and the shipped artifacts (E6)
        working-directory: smartcard-app
        # ------------------------------------------------------------------------------------------
        # THE LOG IS WRITTEN OUTSIDE THE WORKING TREE, AND THAT IS NOT TIDINESS.
        #
        # `tee ladder.log` used to write into the app repository. `tee` creates the file the moment
        # the pipeline starts — so by the time the ladder's FIRST step ran, an untracked `ladder.log`
        # was already sitting in the tree. `preflight` (F3) and `gate:repos-in-sync` (F5) both refuse
        # a dirty tree, and both exclude exactly one generated path by name: `reports/p2/<sha>.json`.
        # They had never been told about this one.
        #
        # So the ladder was failing on a file the step that runs it had just created, in a repository
        # that was otherwise clean. **The local simulation could not catch it**: there the log was
        # written by a second invocation, after the ladder had already been run once, so no ladder
        # run ever saw it.
        #
        # Writing to `runner.temp` fixes it at the cause rather than by adding a third exclusion.
        # A check that has to be taught about every file the harness drops in front of it is a check
        # that will eventually be taught to ignore a real one.
        # ------------------------------------------------------------------------------------------
        env:
          LADDER_LOG: ${{ runner.temp }}/ladder.log
        run: |
          set -o pipefail
          npm run p2:all 2>&1 | tee "$LADDER_LOG" || true

          echo "----- verdict, read from printed output -----"

          if ! grep -qF 'P2-ALL OK — every step green' "$LADDER_LOG"; then
            # ------------------------------------------------------------------------------------
            # THE DIAGNOSIS GOES INTO ANNOTATIONS, NOT ONLY INTO THE LOG.
            #
            # A job's log and its uploaded artifacts both require repository admin to read through
            # the API. **Check-run annotations do not** — they are public on a public repository.
            # For three runs the only thing readable from outside was "the ladder did not print its
            # sentinel", which is the question, not the answer, and each guess cost a full round
            # trip through four npm installs.
            #
            # So every red row becomes its own annotation. Decide on printed output — and make the
            # printed output reachable by whoever has to decide.
            # ------------------------------------------------------------------------------------
            echo "::error::F4/E7 NOT SATISFIED — the ladder did not print its sentinel."
            grep -E '^\s+FAIL ' "$LADDER_LOG" | head -8 | while IFS= read -r line; do
              echo "::error::ladder red: $(echo "$line" | sed 's/^[[:space:]]*//')"
            done
            grep -E 'P2-ALL (FAILED|INCOMPLETE|DEVICE-BLOCKED)' "$LADDER_LOG" | head -2 \
              | while IFS= read -r line; do echo "::error::verdict: $line"; done
            grep -E '^\s+steps ' "$LADDER_LOG" | head -1 \
              | while IFS= read -r line; do echo "::error::counts:$line"; done
            echo "An absent sentinel is a failure, not a pass. What the ladder did print:"
            grep -E 'P2-ALL|FAILED|INCOMPLETE|DEVICE-BLOCKED' "$LADDER_LOG" || tail -40 "$LADDER_LOG"
            exit 1
          fi

          if ! grep -qF 'REAL-ARTIFACTS OK — 5 of 5 shas matched' "$LADDER_LOG"; then
            echo "::error::E6 NOT SATISFIED — the real-artifacts sentinel was not printed."
            grep -E 'REAL-ARTIFACTS' "$LADDER_LOG" || true
            exit 1
          fi

          # ------------------------------------------------------------------------------------
          # THE SENTINELS ARE ECHOED AS ANNOTATIONS, SO THE EVIDENCE IS READABLE WITHOUT ADMIN.
          #
          # F4's contract row asks for a CI run that PRINTS `P2-ALL OK`. A green step is not that —
          # it is a status, and this campaign's rule is to decide on printed output, never on an
          # exit code. But a job's log and its artifacts both require repository admin through the
          # API, so from outside the only readable fact was "the step exited 0".
          #
          # Check-run annotations are public on a public repository. Emitting the MATCHED LINES —
          # grepped out of the ladder's own output, not retyped here — puts the contracted sentinel
          # somewhere a reviewer with no special access can read it and compare against the contract.
          # ------------------------------------------------------------------------------------
          echo "::notice title=F4/E7 sentinel::$(grep -F 'P2-ALL OK — every step green' "$LADDER_LOG" | head -1)"
          echo "::notice title=E6 sentinel::$(grep -F 'REAL-ARTIFACTS OK — 5 of 5 shas matched' "$LADDER_LOG" | head -1 | sed 's/^[[:space:]]*//')"
          echo "::notice title=ladder counts::$(grep -E '^\s+steps ' "$LADDER_LOG" | head -1 | sed 's/^[[:space:]]*//')"
          echo "::notice title=measured at::app $(git -C "$GITHUB_WORKSPACE/smartcard-app" rev-parse HEAD) · pipeline $(git -C "$GITHUB_WORKSPACE/smartcard-data-pipeline" rev-parse HEAD)"

          echo "F4 · E7  P2-ALL OK — every step green"
          echo "E6       REAL-ARTIFACTS OK — 5 of 5 shas matched"
          {
            echo ""
            echo "### Criteria proven on this machine"
            echo ""
            echo '| criterion | sentinel |'
            echo '|---|---|'
            echo '| F4 | `P2-ALL OK — every step green` |'
            echo '| E7 | `P2-ALL OK — every step green` |'
            echo '| E6 | `REAL-ARTIFACTS OK — 5 of 5 shas matched` |'
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================================================
      # THE P3 LADDER (V1/V2). Same discipline as the P2 ladder above: the whole ladder in one
      # command, the verdict read from printed output, the exact contracted sentinel asserted by
      # grep. V2 is FRESH-flagged and OQ-004 names THIS runner as the machine that proves it.
      # ============================================================================================
      - name: the whole P3 ladder (V1, V2)
        working-directory: smartcard-app
        env:
          P3_LADDER_LOG: ${{ runner.temp }}/p3-ladder.log
        run: |
          set -o pipefail
          npm run p3:all 2>&1 | tee "$P3_LADDER_LOG" || true

          echo "----- verdict, read from printed output -----"

          if ! grep -qF 'P3-ALL OK — every step green' "$P3_LADDER_LOG"; then
            echo "::error::V1/V2 NOT SATISFIED — the P3 ladder did not print its sentinel."
            grep -E '^\s+FAIL |^\s+MISS ' "$P3_LADDER_LOG" | head -8 | while IFS= read -r line; do
              echo "::error::ladder red: $(echo "$line" | sed 's/^[[:space:]]*//')"
            done
            grep -E 'P3-ALL (FAILED|INCOMPLETE|DEVICE-BLOCKED)' "$P3_LADDER_LOG" | head -2 \
              | while IFS= read -r line; do echo "::error::verdict: $line"; done
            echo "An absent sentinel is a failure, not a pass. What the ladder did print:"
            grep -E 'P3-ALL|FAILED|INCOMPLETE|DEVICE-BLOCKED' "$P3_LADDER_LOG" || tail -40 "$P3_LADDER_LOG"
            exit 1
          fi

          echo "::notice title=V1/V2 sentinel::$(grep -F 'P3-ALL OK — every step green' "$P3_LADDER_LOG" | head -1)"
          echo "::notice title=P3 ladder counts::$(grep -E '^\s+steps ' "$P3_LADDER_LOG" | head -1 | sed 's/^[[:space:]]*//')"
          echo "::notice title=measured at::app $(git -C "$GITHUB_WORKSPACE/smartcard-app" rev-parse HEAD) · pipeline $(git -C "$GITHUB_WORKSPACE/smartcard-data-pipeline" rev-parse HEAD)"

          {
            echo ""
            echo '| criterion | sentinel |'
            echo '|---|---|'
            echo '| V1 | `P3-ALL OK — every step green` |'
            echo '| V2 | `P3-ALL OK — every step green` (this runner, per OQ-004) |'
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================================================
      # THE P4 LADDER (V2). Same discipline as the P2 and P3 ladders above: the whole ladder in one
      # command, the verdict read from printed output, the exact contracted sentinel asserted by
      # grep. P4 V2 is FRESH-flagged and OQ-004 names THIS runner as the machine that proves it.
      # ============================================================================================
      - name: the whole P4 ladder (V2)
        working-directory: smartcard-app
        env:
          P4_LADDER_LOG: ${{ runner.temp }}/p4-ladder.log
        run: |
          set -o pipefail
          npm run p4:all 2>&1 | tee "$P4_LADDER_LOG" || true

          echo "----- verdict, read from printed output -----"

          if ! grep -qF 'P4-ALL OK — every step green' "$P4_LADDER_LOG"; then
            echo "::error::P4 V2 NOT SATISFIED — the P4 ladder did not print its sentinel."
            grep -E '^\s+FAIL |^\s+MISS ' "$P4_LADDER_LOG" | head -8 | while IFS= read -r line; do
              echo "::error::ladder red: $(echo "$line" | sed 's/^[[:space:]]*//')"
            done
            grep -E 'P4-ALL (FAILED|INCOMPLETE|DEVICE-BLOCKED)' "$P4_LADDER_LOG" | head -2 \
              | while IFS= read -r line; do echo "::error::verdict: $line"; done
            echo "An absent sentinel is a failure, not a pass. What the ladder did print:"
            grep -E 'P4-ALL|FAILED|INCOMPLETE|DEVICE-BLOCKED' "$P4_LADDER_LOG" || tail -40 "$P4_LADDER_LOG"
            exit 1
          fi

          echo "::notice title=P4 V2 sentinel::$(grep -F 'P4-ALL OK — every step green' "$P4_LADDER_LOG" | head -1)"
          echo "::notice title=P4 ladder counts::$(grep -E '^\s+steps ' "$P4_LADDER_LOG" | head -1 | sed 's/^[[:space:]]*//')"
          echo "::notice title=measured at::app $(git -C "$GITHUB_WORKSPACE/smartcard-app" rev-parse HEAD) · pipeline $(git -C "$GITHUB_WORKSPACE/smartcard-data-pipeline" rev-parse HEAD)"

          {
            echo ""
            echo '| criterion | sentinel |'
            echo '|---|---|'
            echo '| P4 V2 | `P4-ALL OK — every step green` (this runner, per OQ-004) |'
          } >> "$GITHUB_STEP_SUMMARY"

      # The boundary rules are also proven CAPABLE OF FAILING, here. A rule that has never been
      # watched to fire is not a rule, and a control recorded only on a laptop is a claim about a
      # laptop.
      - name: boundary rules are watched to fire (negative controls)
        working-directory: smartcard-app
        run: npm run p2:controls

      # D4: eight checks that have never caught anything are eight claims.
      - name: no-rederivation checks are watched to fire (negative controls)
        working-directory: smartcard-app
        run: npm run p2:controls:d4

      # The matchers these gates decide on are themselves controlled, and the controls run here so
      # they are proven in the same environment that surfaced the bug they exist for.
      - name: gate matchers are controlled
        working-directory: smartcard-app
        run: node tools/p2/gates/app-root.mjs --self-test

      # THE EVIDENCE LEAVES THE RUNNER. E6/E7/F4 are FRESH-flagged, and the Owner's OQ-004 ruling
      # makes this runner the machine that proves them — so the ladder report has to be retrievable
      # afterwards, or the evidence dies with the container.
      - name: upload the ladder report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-ladder-report
          path: |
            smartcard-app/reports/p2/
            smartcard-app/reports/p3/
            smartcard-app/reports/p4/
            ${{ runner.temp }}/ladder.log
            ${{ runner.temp }}/p3-ladder.log
            ${{ runner.temp }}/p4-ladder.log
          if-no-files-found: warn
