name: CI

# WP-1.3 — THE APP REPOSITORY HAD NO CI AT ALL.
#
# The forensic recorded it as §4.1: no workflow, no automated check, nothing that reads the tree on
# push. Every claim about this app was therefore a claim about one machine.
#
# This is the SKELETON the plan asks for at Phase 1 — install, typecheck, test. It becomes criterion
# F4 in full at Phase 3, when it runs the whole ladder including the five boundary rules.

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the same runtime .nvmrc names. The pipeline repository spent a campaign
          # running its gate ladder on a machine-wide Node 24 while every file said 20, so the
          # version is stated here and asserted below rather than assumed from the runner image.
          node-version-file: '.nvmrc'
          cache: npm

      # `npm ci`, never `npm install`. npm install is permitted to RESOLVE a dependency to a version
      # the lockfile does not name — it updates the lockfile rather than failing — so CI would be
      # verifying a tree that need not be the one a reviewer gets from a clean clone.
      - run: npm ci

      - name: runtime is the pinned one
        run: |
          echo "node $(node --version)  ·  .nvmrc $(cat .nvmrc)"
          test "v$(cat .nvmrc | tr -d '[:space:]')" = "$(node --version)"

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npx jest --ci

      # PHASE 3 MADE THIS HARD. Gate 3 requires `BOUNDARY-LINT OK — 5 rules, 0 violations` **in CI
      # at the pushed sha** — not on a laptop — so this step now fails the build.
      #
      # THE VERDICT IS READ FROM PRINTED OUTPUT, never from an exit code: exit codes are advisory in
      # this project and have been observed false. Two things are asserted, and they are different
      # kinds of assertion on purpose:
      #
      #   1. A POSITIVE SENTINEL must be present. `grep -F` for the exact string the contract names.
      #      Not "no failure text appeared" — an absent sentinel is a failure, which is what catches
      #      a ladder that died before reaching the gate at all.
      #   2. `P2-ALL FAILED` must be absent. Something ran and went red.
      #
      # WHAT IS STILL TOLERATED, and why this is not a softening: `P2-ALL INCOMPLETE` passes, because
      # 38 of the 44 contracted gates are not written yet and a build that cannot go green until
      # Phase 12 teaches everyone to ignore it. The moment an implemented gate goes red the build
      # fails; the moment the last gate lands, INCOMPLETE stops appearing on its own. Nobody has to
      # remember to edit this file — which is the point, because the hand-maintained list of "gates
      # that count" is exactly the defect shape this campaign keeps finding.
      - name: P2 ladder — hard on any implemented gate going red (F4, Gate 3)
        run: |
          set -o pipefail
          npm run p2:all 2>&1 | tee ladder.log || true
          echo "----- verdict, read from printed output -----"
          if grep -qF 'P2-ALL FAILED' ladder.log; then
            echo "CI FAILS: a gate that exists ran and went red."
            grep -F 'P2-ALL FAILED' ladder.log
            exit 1
          fi
          if ! grep -qF 'BOUNDARY-LINT OK — 5 rules, 0 violations' ladder.log; then
            echo "CI FAILS: the Gate 3 sentinel was not printed."
            echo "An absent sentinel is a failure, not a pass — the ladder may not have reached the gate."
            exit 1
          fi
          echo "Gate 3 sentinel present, no gate red."

      # The boundary rules are also proven to be capable of failing, here, in CI. A rule that has
      # never been watched to fire is not a rule, and a control recorded only on a laptop is a claim.
      - name: boundary rules are watched to fire (negative controls)
        run: npm run p2:controls

      - name: upload the ladder report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-ladder-report
          path: reports/p2/
          if-no-files-found: warn
